# Builds the Dex (com.dex) bootstrap or packages for aarch64 on demand. The built debs and
# bootstrap are uploaded as an artifact, and signed and published to the Dex apt repository
# (github.com/minhaj1403/dex-packages) from a local machine with dex/publish-repo.sh.
name: Dex build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options: [bootstrap, packages]
        default: bootstrap
      packages:
        description: "Space separated packages: added to the bootstrap, or the packages to build"
        type: string
        default: ""
      use_repo:
        description: "Download dependencies already published in the Dex repository instead of building them"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build
        env:
          TARGET: ${{ inputs.target }}
          PACKAGES: ${{ inputs.packages }}
          USE_REPO: ${{ inputs.use_repo }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = bootstrap ]; then
            args=(--architectures aarch64)
            [ -n "$PACKAGES" ] && args+=(-a "$(echo $PACKAGES | tr ' ' ',')")
            ./scripts/run-docker.sh ./scripts/build-bootstraps.sh "${args[@]}"
          else
            [ -n "$PACKAGES" ] || { echo "No packages given" >&2; exit 1; }
            args=(-a aarch64)
            [ "$USE_REPO" = true ] && args+=(-I)
            ./scripts/run-docker.sh ./build-package.sh "${args[@]}" $PACKAGES
          fi
          ls -la output/ bootstrap-*.zip 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-${{ inputs.target }}-${{ github.run_number }}
          path: |
            output/*.deb
            bootstrap-*.zip
          if-no-files-found: warn
          retention-days: 14
